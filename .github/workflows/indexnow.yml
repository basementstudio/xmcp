name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect changes without submitting or updating the baseline
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.repository == 'basementstudio/xmcp' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production' &&
      github.event.deployment_status.creator.login == 'vercel[bot]' &&
      startsWith(github.event.deployment_status.environment_url, 'https://xmcp-website-')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always execute trusted main-branch code, never a deployment's arbitrary ref.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website test:indexnow

      - name: Find the last successful snapshot
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            for await (const { data } of github.paginate.iterator(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: 'indexnow.yml', status: 'success', per_page: 100 }
            )) {
              for (const run of data) {
                if (run.id === context.runId) continue;
                const artifacts = await github.paginate(
                  github.rest.actions.listWorkflowRunArtifacts,
                  { owner, repo, run_id: run.id, per_page: 100 }
                );
                if (artifacts.some((artifact) =>
                  artifact.name === 'indexnow-snapshot' && !artifact.expired &&
                  Date.parse(artifact.expires_at) > Date.now()
                )) {
                  core.setOutput('run_id', String(run.id));
                  return;
                }
              }
            }
            core.notice('No retained baseline; this run will start a fresh sitemap baseline.');

      - name: Restore baseline
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: indexnow-snapshot
          path: apps/website/.indexnow
          github-token: ${{ github.token }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Compare production pages and notify IndexNow
        id: submit
        env:
          INDEXNOW_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=(--github-event)
          if [[ "$INDEXNOW_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm --filter website indexnow:submit "${args[@]}"

      - name: Save successful baseline
        if: steps.submit.outputs.submitted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-snapshot
          path: apps/website/.indexnow/snapshot.json
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
