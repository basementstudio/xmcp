name: Nightly conformance

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @xmcp-dev/e2e typecheck
      - run: pnpm run test:unit
      - run: pnpm --filter @xmcp-dev/e2e test
      - name: Upload failed fixture logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-conformance-logs
          path: packages/e2e/.work/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
