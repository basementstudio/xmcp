* { box-sizing: border-box }
body { margin: 0 auto; padding: clamp(18px, 4vw, 48px); max-width: 1480px; background: #fdfdfc; color: #171717; font: 14px/1.45 "Geist Card", Helvetica, sans-serif }
header { display: flex; gap: 14px; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #11111117 }
h1 { margin: 0; font-size: 18px; font-weight: 500; letter-spacing: -0.02em }
main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; margin-top: 28px; align-items: start }
canvas { display: block; width: 100%; height: auto; border-radius: 12px; box-shadow: 0 0 0 1px #00000014, 0 2px 2px #0000000a }
form { display: grid; gap: 14px }
label { display: grid; gap: 6px; color: #525252 }
.row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.inline { display: flex; gap: 8px; align-items: center; color: #525252 }
input, select, textarea, button { font: inherit; color: #171717; padding: 9px 11px; border: 0; border-radius: 10px; background: #1111110d; width: 100% }
textarea { resize: vertical }
input[type=checkbox] { width: auto }
button { cursor: pointer; font-weight: 500 }
button.primary { background: #171717; color: #fdfdfc }
button:disabled { opacity: .45; cursor: default }
.segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: #1111110d }
.segmented button { background: transparent; padding: 7px }
.segmented button[aria-pressed=true] { background: #fff; box-shadow: 0 0 0 1px #00000014, 0 2px 2px #0000000a }
p { margin: 0; color: #8f8f8f; font-size: 13px }
[hidden] { display: none !important }
@media (max-width: 860px) { main { grid-template-columns: 1fr } }
</style>
<header><svg width="21" height="24" viewBox="0 0 21 24" aria-hidden="true"><path id="mark" d="M0 5h1.00213v1H0zm1.00213 17v-3h1.00213v-1H3.0064v-1h2.00426v-1h1.00213v-1h1.00213v2h2.00427v1h1.00211v1h1.0022v1h-1.0022v1H9.01919v1H8.01706v-1H7.01492v-1H5.01066v1H4.00853v2h1.00213v1H3.0064v-1H2.00426v-1zm0-17V3h1.00213V2H3.0064V1h4.00852v1h2.00427v1h1.00211v2h1.0022v1h1.0021v1h1.0021v1h-1.0021v1h5.0106v1h-1.0021v1h-2.0043v2h1.0022v1h1.0021v1h1.0021v2h1.0022v1h1.0021v1h-2.0043v1h-1.0021v1H15.032v-1h-1.0022v-2h-1.0021v-2h-1.0021v-1h-1.0021v-2H9.01919v-1H2.00426v-1H3.0064v-1h1.00213V9h4.00853V8H7.01492V6H6.01279V4H5.01066V3H4.00853v1H2.00426v1zm6.01279 10v-1h1.00214v1zm1.00214-1v-1h1.00213v1zm3.00644 5v-1h1.0021v1zm0-14V4h1.0021v1zm1.0021-1V3h1.0021V1h2.0043v1h2.0042V1h2.0043v3h-1.0021v1h-2.0043v1H15.032V5h-1.0022v2h-1.0021V4zm7.0149 14v-1h1.0021v1zm0-17V0h1.0021v1z"/></svg><h1>Release cards</h1></header>
<main>
<canvas width="1600" height="900" aria-label="Card preview"></canvas>
<form>
  <label>Start from<select id="preset"></select></label>
  <div class="segmented" role="group" aria-label="Theme"><button type="button" data-theme="light" aria-pressed="true">Light</button><button type="button" data-theme="dark" aria-pressed="false">Dark</button></div>
  <label>Pills<div class="row"><input id="pill0" maxlength="18"><input id="pill1" maxlength="18"><input id="pill2" maxlength="18"></div></label>
  <label>Layout<select id="layout"><option value="title">Title and paragraph</option><option value="list">List</option></select></label>
  <label data-for="title">Title<textarea id="title" rows="2" maxlength="60"></textarea></label>
  <label data-for="title">Paragraph<textarea id="paragraph" rows="2" maxlength="110"></textarea></label>
  <label data-for="list">Items, one per line<textarea id="items" rows="3" maxlength="110"></textarea></label>
  <label>Figure<div class="row" style="grid-template-columns: 1fr auto"><select id="figure"></select><button type="button" id="shuffle">Shuffle</button></div></label>
  <label class="inline"><input type="checkbox" id="safe"> Show X safe area</label>
  <button type="button" class="primary" id="download">Download PNG</button>
  <p id="status" role="status"></p>
</form>
</main>
<script>
const W = 1600, H = 900;
const SAFE = { x0: 112, y0: 112, x1: W - 112, y1: H - 124 };
const FONT = '"Geist Card", Helvetica, Arial, sans-serif';
const THEMES = {
  light: { bg: '#f4f3ee', ink: '#171717', text: '#525252', well: 'rgba(17, 17, 17, 0.055)', max: 0.14 },
  dark: { bg: '#121211', ink: '#ededed', text: '#a3a3a3', well: 'rgba(237, 237, 237, 0.08)', max: 0.11 }
};
const PRESETS = {
  patch: { label: 'Patch note', pills: ['Patch note', 'v1.12.1', ''], layout: 'title', title: 'Native ESM imports', paragraph: 'Provider plugins load directly in Node.js.', figure: 'silk' },
  plugin: { label: 'Plugin update', pills: ['Plugin', 'x402', 'v1.3.0'], layout: 'title', title: 'Pay with Nano send blocks', paragraph: 'Signed blocks are checked against the offer before they are published.', figure: 'swirl' },
  cli: { label: 'CLI update', pills: ['CLI', 'v1.13.0', ''], layout: 'title', title: 'Move off 0.x safely', paragraph: 'One upgrade command moves your project and lists what it can’t change.', figure: 'rain' },
  list: { label: 'Release notes', pills: ['Release notes', 'v1.12.0', ''], layout: 'list', items: 'Resource cache hints\nFull Zod schemas\nTrace context in logs', figure: 'corner' }
};
const xMark = new Path2D(document.querySelector('#mark').getAttribute('d'));
const clamp = v => v < 0 ? 0 : v > 1 ? 1 : v;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t) };
const hash = (x, y) => { const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v) };
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 5; i++) { sum += amp * noise(x * freq, y * freq); freq *= 2.03; amp *= 0.5 }
  return sum / 0.97;
}
const disc = (sx = 1, sy = 1, a = 1.25, b = 0.1) => (x, y) => smooth(a, b, Math.hypot(x * sx, y * sy));
const vein = ({ seed, freq, warp, sx = 1, sy = 1, ridge, gain, lo = 0.05, fade }) => (x, y, shift) => {
  const X = x * sx + shift, Y = y * sy - shift * 0.7;
  const wx = fbm(X * 1.3 + 4.1 + seed, Y * 1.3 + 1.7), wy = fbm(X * 1.3 + 8.3, Y * 1.3 + 2.9 + seed);
  const f = (1 - Math.abs(2 * fbm(X * freq + wx * warp + seed * 3.1, Y * freq + wy * warp) - 1)) ** ridge;
  return fade(x, y) * clamp((f - lo) * gain) ** 1.4;
};
const SHAPES = {
  base: vein({ seed: 3, freq: 1.1, warp: 2.4, ridge: 3, gain: 1.6, fade: disc(0.85) }),
  silk: vein({ seed: 4, sx: 0.5, sy: 1.5, freq: 1.1, warp: 2, ridge: 4, gain: 1.6, fade: disc(0.6, 1.3) }),
  fine: vein({ seed: 6, freq: 2, warp: 2.2, ridge: 6, gain: 1.8, lo: 0.04, fade: disc(0.85) }),
  swirl: vein({ seed: 12, freq: 1, warp: 3.6, ridge: 4, gain: 1.7, fade: disc(0.9) }),
  rain: vein({ seed: 10, sx: 1.6, sy: 0.45, freq: 1.1, warp: 2, ridge: 4, gain: 1.6, fade: disc(1.1, 0.7) }),
  tangle: vein({ seed: 13, freq: 1.4, warp: 3, ridge: 4, gain: 1.7, fade: disc(0.9) })
};
const FIGURES = {
  silk: { label: 'Silk', shape: 'silk', cx: 1300, cy: 300, size: 520 },
  fine: { label: 'Fine', shape: 'fine', cx: 1400, cy: 330, size: 560 },
  swirl: { label: 'Swirl', shape: 'swirl', cx: 1420, cy: 420, size: 540 },
  edge: { label: 'Silk, top edge', shape: 'silk', cx: 1300, cy: 40, size: 520 },
  rain: { label: 'Rain', shape: 'rain', cx: 1360, cy: 400, size: 520 },
  tangle: { label: 'Tangle', shape: 'tangle', cx: 1440, cy: 300, size: 520 },
  corner: { label: 'Corner', shape: 'base', cx: 1560, cy: 860, size: 620 },
  none: { label: 'None' }
};

const $ = id => document.getElementById(id);
const canvas = document.querySelector('canvas'), g = canvas.getContext('2d');
const state = { theme: 'light', shift: 0 };
const figureCache = new Map();

function renderFigure(theme, name, shift, w, h) {
  const layer = new OffscreenCanvas(w, h), lg = layer.getContext('2d');
  const f = FIGURES[name], t = THEMES[theme];
  if (!f.shape) return layer;
  const scale = w / W, tone = SHAPES[f.shape];
  const p = Math.max(5, Math.round(6 * scale)), max = t.max * (w < W ? 0.8 : 1);
  const cx = (f.cx + (W - f.cx) * 0.25) * scale, cy = f.cy * h / H, size = f.size * 0.78 * scale;
  lg.fillStyle = t.ink;
  for (let y = p / 2; y < h + p; y += p) {
    for (let x = p / 2; x < w + p; x += p) {
      const keep = smooth(0, 280 * scale, x - 900 * scale);
      const v = tone((x - cx) / size, (y - cy) / size, shift) * max * keep;
      const r = v >= 0.04 ? p * 0.71 * Math.sqrt(v) : v > 0.002 && hash(x * 0.37, y * 0.71) < v / 0.04 ? p * 0.71 * 0.2 : 0;
      if (r < 0.35) continue;
      lg.beginPath(); lg.arc(x, y, r, 0, Math.PI * 2); lg.fill();
    }
  }
  return layer;
}

function figureLayer(theme, name, shift) {
  const key = `${theme}:${name}`, cached = figureCache.get(key);
  if (cached?.shift === shift) return cached.layer;
  const layer = renderFigure(theme, name, shift, W, H);
  figureCache.set(key, { shift, layer });
  return layer;
}

function setFont(size, weight, tracking) { g.font = `${weight} ${size}px ${FONT}`; g.letterSpacing = tracking + 'px' }
function wrap(text, width) {
  const out = [];
  for (const block of text.split('\n')) {
    let line = '';
    for (const word of block.trim().split(/\s+/).filter(Boolean)) {
      const next = line ? line + ' ' + word : word;
      if (line && g.measureText(next).width > width) { out.push(line); line = word } else line = next;
    }
    if (line) out.push(line);
  }
  return out;
}

function drawPills(t, pills) {
  const cy = SAFE.y0 + 27;
  g.save(); g.fillStyle = t.ink; g.translate(SAFE.x0, SAFE.y0); g.scale(2.25, 2.25); g.fill(xMark); g.restore();
  let x = SAFE.x0 + 78;
  setFont(28, 500, -0.2);
  for (const text of pills) {
    const w = Math.round(g.measureText(text).width + 52);
    g.fillStyle = t.well; g.beginPath(); g.roundRect(x, cy - 28, w, 56, 28); g.fill();
    g.fillStyle = t.text; g.textBaseline = 'middle'; g.fillText(text, x + 26, cy + 1); g.textBaseline = 'alphabetic';
    x += w + 12;
  }
  return x - 12 <= SAFE.x1;
}

function drawTitle(t, title, paragraph) {
  const size = 104, lead = size * 0.95;
  setFont(size, 500, -size * 0.045);
  const titleLines = wrap(title, 820);
  setFont(38, 400, -0.5);
  const paraLines = paragraph ? wrap(paragraph, 720) : [];
  const gap = paraLines.length ? 80 : 0;
  let y = SAFE.y1 - paraLines.length * 50 + (paraLines.length ? 12 : 0) - gap - (titleLines.length - 1) * lead;
  g.fillStyle = t.ink; setFont(size, 500, -size * 0.045);
  titleLines.forEach((line, i) => g.fillText(line, SAFE.x0 - size * 0.06, y + i * lead));
  y += (titleLines.length - 1) * lead + gap;
  g.fillStyle = t.text; setFont(38, 400, -0.5);
  paraLines.forEach((line, i) => g.fillText(line, SAFE.x0, y + i * 50));
  return titleLines.length <= 3 && paraLines.length <= 2 && y - gap - (titleLines.length - 1) * lead - size > SAFE.y0 + 120;
}

function drawList(t, items) {
  const top = SAFE.y1 - items.length * 92;
  setFont(52, 500, -2);
  items.forEach((text, i) => {
    const y = top + i * 92;
    g.save(); g.globalAlpha = 0.12; g.fillStyle = t.ink; g.fillRect(SAFE.x0, y, 760, 2); g.restore();
    g.fillStyle = t.ink; g.fillText(text, SAFE.x0 - 3, y + 68);
  });
  return items.length <= 3 && items.every(text => g.measureText(text).width <= 760);
}

function drawSafe() {
  g.save();
  g.strokeStyle = '#e5484d'; g.setLineDash([10, 8]); g.lineWidth = 2;
  g.strokeRect(SAFE.x0, SAFE.y0, SAFE.x1 - SAFE.x0, SAFE.y1 - SAFE.y0);
  g.fillStyle = 'rgba(229, 72, 77, 0.12)'; g.fillRect(0, 0, W, 50); g.fillRect(0, H - 50, W, 50); g.fillRect(24, H - 96, 150, 66);
  g.restore();
}

function draw() {
  const t = THEMES[state.theme];
  const pills = [0, 1, 2].map(i => $('pill' + i).value.trim()).filter(Boolean);
  const list = $('layout').value === 'list';
  const items = $('items').value.split('\n').map(s => s.trim()).filter(Boolean);
  g.fillStyle = t.bg; g.fillRect(0, 0, W, H);
  g.drawImage(figureLayer(state.theme, $('figure').value, state.shift), 0, 0);
  let fits = drawPills(t, pills);
  fits = (list ? drawList(t, items) : drawTitle(t, $('title').value.trim(), $('paragraph').value.trim())) && fits;
  const complete = pills.length > 0 && (list ? items.length > 0 : $('title').value.trim());
  $('status').textContent = !complete ? 'Add a pill and a title or list item.' : fits ? '' : 'Shorten the copy to keep it inside the safe area.';
  $('download').disabled = !complete || !fits;
  canvas.setAttribute('aria-label', [...pills, list ? items.join(', ') : $('title').value, list ? '' : $('paragraph').value].filter(Boolean).join('. '));
  if ($('safe').checked) drawSafe();
  document.querySelectorAll('[data-for]').forEach(el => { el.hidden = el.dataset.for !== $('layout').value });
}

function applyPreset(key) {
  const p = PRESETS[key];
  p.pills.forEach((v, i) => { $('pill' + i).value = v });
  $('layout').value = p.layout;
  $('title').value = p.title || '';
  $('paragraph').value = p.paragraph || '';
  $('items').value = p.items || '';
  $('figure').value = p.figure;
  state.shift = 0;
  draw();
}

function setTheme(theme) {
  state.theme = theme;
  document.querySelectorAll('[data-theme]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
  draw();
}

$('preset').innerHTML = Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${p.label}</option>`).join('');
$('figure').innerHTML = Object.entries(FIGURES).map(([k, f]) => `<option value="${k}">${f.label}</option>`).join('');
$('preset').addEventListener('change', e => applyPreset(e.target.value));
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.theme)));
document.querySelector('form').addEventListener('input', draw);
$('figure').addEventListener('change', () => { state.shift = 0; draw() });
$('shuffle').addEventListener('click', () => { state.shift = Math.round(Math.random() * 400) / 10 + 0.1; draw() });
$('download').addEventListener('click', () => {
  const safe = $('safe').checked;
  if (safe) { $('safe').checked = false; draw() }
  const pills = [0, 1, 2].map(i => $('pill' + i).value.trim()).filter(Boolean);
  const link = document.createElement('a');
  link.download = ['xmcp', ...pills, state.theme].join('-').toLowerCase().replace(/[^a-z0-9.-]+/g, '-') + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  if (safe) { $('safe').checked = true; draw() }
});

const params = new URLSearchParams(location.search);
if (params.get('figure') in FIGURES && params.has('w')) {
  const w = +params.get('w'), h = +params.get('h') || Math.round(w * H / W);
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  canvas.width = w; canvas.height = h;
  g.drawImage(renderFigure(theme, params.get('figure'), 0, w, h), 0, 0);
  document.body.style.cssText = 'margin:0;padding:0;max-width:none;background:transparent';
  document.querySelector('header').hidden = true; document.querySelector('form').hidden = true;
  document.querySelector('main').style.cssText = 'display:block;margin:0';
  canvas.style.cssText = `width:${w}px;border-radius:0;box-shadow:none`;
} else Promise.all([document.fonts.load(`400 38px ${FONT}`), document.fonts.load(`500 104px ${FONT}`)]).then(() => {
  applyPreset(params.get('preset') in PRESETS ? params.get('preset') : 'patch');
  if (params.get('theme') === 'dark') setTheme('dark');
  if (params.has('solo')) { document.body.style.cssText = 'margin:0;padding:0;max-width:none'; document.querySelector('header').hidden = true; document.querySelector('form').hidden = true; document.querySelector('main').style.cssText = 'display:block;margin:0'; canvas.style.cssText = 'width:1600px;border-radius:0;box-shadow:none' }
});
</script>
</html>
